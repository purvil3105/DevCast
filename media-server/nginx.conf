worker_processes 1;
events {}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;

        application live {
            live on;

            # Authenticate the broadcaster before accepting the stream.
            # nginx POSTs the stream key (as `name`) to the API; 2xx = allow.
            on_publish http://host.docker.internal:3000/api/streams/rtmp/auth;

            # Record stream to flv
            record all;
            record_path /tmp/recordings;
            record_unique on;
            
            # When stream ends, trigger the upload script
            exec_record_done bash /etc/nginx/s3_upload.sh $path $name;
            
            # Execute ffmpeg to transcode into 1 quality (720p) to save CPU
            exec sh -c "ffmpeg -i rtmp://localhost:1935/live/$name -c:a aac -b:a 128k -c:v libx264 -b:v 2500k -pix_fmt yuv420p -f flv -g 60 -r 30 -s 1280x720 -preset superfast -profile:v baseline rtmp://localhost:1935/hls/${name}_720p > /tmp/ffmpeg.log 2>&1";

        }

        application hls {
            live on;
            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;

            hls_variant _720p BANDWIDTH=2628000,RESOLUTION=1280x720;

            # Disable consuming the stream directly via RTMP
            deny play all;
        }
    }
}

http {
    server {
        listen 8080;

        location /hls {
            # Serve HLS fragments
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            
            # CORS setup for HLS.js
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;

            # Handle OPTIONS preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Type 'text/plain charset=UTF-8' always;
                add_header Content-Length 0 always;
                return 204;
            }
        }

        location = /empty.m3u8 {
            default_type application/vnd.apple.mpegurl;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control no-cache always;
            return 200 "#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n";
        }
    }
}
