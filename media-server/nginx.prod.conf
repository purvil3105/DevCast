# RTMP module is statically compiled into Nginx binary (not loaded dynamically)
# load_module modules/ngx_rtmp_module.so;

worker_processes auto;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;

        application live {
            live on;

            # Authenticate the broadcaster before accepting the stream.
            on_publish http://api:3000/api/streams/rtmp/auth;

            # Notify API when broadcaster disconnects (OBS stops streaming)
            on_publish_done http://api:3000/api/streams/rtmp/done;

            # Direct native HLS packaging (zero CPU overhead, no dropped video frames)
            hls on;
            hls_path /var/hls/live;
            hls_fragment 2s;
            hls_playlist_length 10s;

            # Record stream locally to flv
            record all;
            record_path /var/hls/recordings;
            record_unique on;
            
            # When stream ends, trigger the local VOD processing script
            exec_record_done /etc/nginx/vod_process.sh $path $name;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 8080;

        # Live HLS streams
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /var/hls/live/;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Recorded VOD playback
        location /vod/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /var/hls/vod/;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /empty.m3u8 {
            default_type application/vnd.apple.mpegurl;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-cache, no-store" always;
            return 200 "#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n";
        }
    }
}
