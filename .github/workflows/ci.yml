name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type-check (server, sandbox, client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client is generated from schema.prisma; the server imports it,
      # so generate it before type-checking or the build fails on a missing type.
      - name: Generate Prisma client
        run: npm run db:generate -w server

      - name: Type-check server
        run: npx tsc --noEmit
        working-directory: server

      - name: Type-check sandbox
        run: npx tsc --noEmit
        working-directory: sandbox

      # The client build runs `tsc -b` first, so it type-checks and bundles.
      - name: Build client
        run: npm run build -w client
